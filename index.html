<!DOCTYPE html>
<html>
<head>
  <title>Mobayo’s Movie Night</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 40px;
    }
    #wheel {
      margin: 40px auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 10px solid crimson;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 3s;
    }
    button {
      padding: 15px 30px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<script>
let pass = prompt("Enter Password");
if (pass !== "Mobayo") {
  document.body.innerHTML = "Wrong Password 😂";
}
</script>

<h1>🎬 Welcome Mobayo</h1>
<p>From Precious ❤️ (No skipping allowed oh!)</p>
<p>Funny rule: Spin and behave yourself 😂</p>
<p>Spin once = Movie <br> Spin twice = Series 😌</p>

<div id="wheel">Ready</div>
<button onclick="spin()">SPIN</button>

<h2 id="result">---</h2>

<script>
let movies = [
"John Wick","The Dark Knight","Gladiator","Se7en","Knives Out",
"Get Out","Inception","Prisoners","Shutter Island","Equalizer"
];

let series = [
"Breaking Bad","Peaky Blinders","The Boys",
"Stranger Things","Money Heist","The Night Agent"
];

let count = 0;
let deg = 0;

function spin() {
  count++;
  deg += 720;
  document.getElementById("wheel").style.transform = "rotate(" + deg + "deg)";

  setTimeout(function() {
    if (count % 2 !== 0) {
      let pick = movies[Math.floor(Math.random() * movies.length)];
      document.getElementById("wheel").innerHTML = "Movie";
      document.getElementById("result").innerHTML = "🎥 You’re watching: " + pick;
    } else {
      let pick = series[Math.floor(Math.random() * series.length)];
      document.getElementById("wheel").innerHTML = "Series";
      document.getElementById("result").innerHTML = "📺 You’re binging: " + pick;
    }
  }, 3000);
}
</script>

</body>
</html>
